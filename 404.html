<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>404 · Jingbo Wang</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f8f6fc; --ink:#2d273b; --muted:#6b6479; --line:#e2ddeb; --accent:#6f60b8; --green:#514071; --font-serif:"Source Serif 4",Georgia,serif; --font-sans:"IBM Plex Sans","Segoe UI",sans-serif; color-scheme:light; }
    html[data-theme="dark"] { --paper:#16131e; --ink:#ece9f3; --muted:#a79eba; --line:#322c43; --accent:#a99ce6; --green:#453a6b; color-scheme:dark; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) { --paper:#16131e; --ink:#ece9f3; --muted:#a79eba; --line:#322c43; --accent:#a99ce6; --green:#453a6b; color-scheme:dark; }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:22px/1.6 var(--font-sans); text-align:center; }
    main { width:min(560px,calc(100% - 64px)); padding:60px 0; }
    h1 { margin:0 0 6px; font:normal clamp(96px,22vw,170px)/1 var(--font-serif); letter-spacing:-.05em; }
    h1 em { color:var(--accent); font-style:normal; }
    p { margin:0 0 30px; color:var(--muted); }
    .home { display:inline-flex; align-items:center; gap:12px; padding:11px 18px; border:1px solid var(--green); border-radius:2px; background:var(--green); color:#fff; font-size:20px; font-weight:650; text-decoration:none; }
    .home:hover { border-color:var(--accent); background:var(--accent); }
    html[data-theme="dark"] .home:hover { color:#16131e; }
    .home:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <h1>4<em>0</em>4</h1>
    <p>This page wandered off — the robots will bring it back.</p>
    <a class="home" href="/">Back to the homepage</a>
  </main>
</body>
</html>
