<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piper X + R5a robot playground</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:radial-gradient(circle at 50% 25%,#fffafd,#eee8f8 72%); }
    .robot-companion { position:fixed; inset:0; pointer-events:none; }
    .robot-companion canvas { display:block; width:100%; height:100%; }
    .home-hero { width:100%; height:100%; touch-action:none; }
    .home-hero.over-letter { cursor:grab; }
    .home-hero.is-dragging { cursor:grabbing; }
    .homepage-content { display:none; }
    .playground-hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:1; box-sizing:border-box; width:max-content; max-width:calc(100% - 24px); margin:0; padding:9px 15px; border:1px solid rgba(141,120,176,.25); border-radius:999px; background:rgba(255,252,255,.83); color:#51475e; font:16px/1.35 system-ui,sans-serif; text-align:center; pointer-events:none; }
    .arm-labels { position:fixed; left:4%; right:4%; bottom:16px; display:flex; justify-content:space-between; pointer-events:none; font:19px/1.3 system-ui,sans-serif; color:#5a5361; letter-spacing:.02em; }
    .arm-labels div:last-child { text-align:right; }
    .arm-labels strong { display:block; color:#36313d; font-size:22px; font-weight:650; letter-spacing:0; }
    @media (max-width:600px) { .playground-hint { top:8px; border-radius:16px; font-size:14px; } .arm-labels { bottom:10px; font-size:17px; } .arm-labels strong { font-size:19px; } }
  </style>

  <div class="robot-companion" aria-label="Interactive AgileX Piper X and ARX R5a arms arranging letters, a Chiikawa toy and a football"></div>
  <div class="home-hero"></div>
  <p class="playground-hint">Drag an object to a new spot and release it. The robots will return it.</p>
  <div class="arm-labels" aria-label="Robot models"><div><span>AgileX Robotics</span><strong>Piper X</strong></div><div><span>ARX Robotics</span><strong>R5a</strong></div></div>
  <div class="homepage-content"></div>
  <script type="module" src="./assets/js/robot-companion.js?v=60"></script>

</html>
